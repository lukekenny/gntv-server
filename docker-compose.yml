services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://gntv:gntv@postgres:5432/gntv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gntv
      POSTGRES_USER: gntv
      POSTGRES_PASSWORD: gntv
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gntv -d gntv"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
