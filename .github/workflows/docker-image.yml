name: gntv-server docker

on:
  push:
    branches: ["main"]
    # tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gntv-server
  IMAGE: ghcr.io/${{ github.repository_owner }}/gntv-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: "v3.0.6"

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name builder --use
          docker buildx inspect --bootstrap

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Generate Docker metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          TAGS="${IMAGE}:sha-${SHORT_SHA}"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            TAGS="${IMAGE}:latest,${TAGS}"
          fi

          {
            echo "tags=${TAGS}"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.revision=${{ github.sha }}"
            echo "org.opencontainers.image.ref.name=${{ github.ref_name }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-and-push
        shell: bash
        run: |
          PUSH_ARG=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            PUSH_ARG="--push"
          else
            PUSH_ARG="--load"
          fi

          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"

          TAG_ARGS=()
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_ARGS+=("--tag" "$tag")
          done

          docker buildx build \
            --file ./Dockerfile \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg OM_BUILD_SHA="${{ github.sha }}" \
            --build-arg OM_BUILD_REF="${{ github.ref_name }}" \
            --build-arg OM_BUILD_TIME="${{ github.event.head_commit.timestamp }}" \
            --build-arg OM_IMAGE="${IMAGE}:latest" \
            "${TAG_ARGS[@]}" \
            ${PUSH_ARG} \
            .

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            DIGEST="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA::7}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        shell: bash
        run: |
          echo "${TAGS}" | tr ',' '\n' | xargs -I {} cosign sign --yes {}@${DIGEST}
